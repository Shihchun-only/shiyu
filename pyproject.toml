[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shiyu-french"
version = "0.1.0"
description = "A local French course notebook with classified-PDF import and dictionary audio caching"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pypdf>=6.19,<7", "reportlab>=5,<6", "Pillow>=12,<13"]

[project.scripts]
shiyu = "shiyu.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiyu = ["assets/*"]
