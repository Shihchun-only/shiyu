<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾语 · 我的法语课程</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><span class="brand-mark">拾</span><div><b>拾语</b><small>MON CARNET DE FRANÇAIS</small></div></div><div class="head-actions"><button id="importBtn" class="primary">＋ 导入分类课件</button><button id="favoritesBtn">☆ 收藏</button><button id="exportBtn">打印与导出</button><button id="settingsBtn" aria-label="设置与备份">设置</button></div></header>
<div id="toast" role="status" aria-live="polite">正在打开本地资料库…</div>
<div class="layout"><nav><div class="nav-title"><span>我的课程</span><button id="newCourse" class="icon" title="新建课程">＋</button></div><div class="search"><input id="searchInput" placeholder="搜索单词、笔记…" aria-label="搜索单词和笔记"><button id="searchBtn" aria-label="搜索">⌕</button></div><div id="courses"></div><div class="nav-foot"><button id="trashBtn">回收站</button><small id="libraryStats"></small><p>资料与音频保存在这台电脑。</p></div></nav>
<main><div id="welcome"><span class="eyebrow">学习从一页课件开始</span><h1>让每个法语词，<br>都能听、能查、能记。</h1><p>导入已经分好类的 PDF，软件会整理词典内容，<br>把释义和发音留在本地，供你反复复习。</p><button id="sampleBtn" class="primary">打开自制示例课件</button><p class="muted">示例仅包含图片与分类。词典和发音由软件联网获取。</p></div>
<section id="reader" hidden><div class="eyebrow" id="courseName"></div><div class="title-row"><h1 id="lessonTitle"></h1><button id="manageBtn" class="quiet">管理节次</button></div><div class="reader-tools"><button id="prevBtn" aria-label="上一页">←</button><span id="pageCount"></span><button id="nextBtn" aria-label="下一页">→</button><button id="marksBtn">显示单词区域</button><button id="classifyBtn">分类清单</button><label class="zoom">缩放 <select id="zoom"><option value="1">适应</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></div><div id="stageScroll"><div id="stage"></div></div><div class="below-image"><span id="pageName"></span><span id="pageStats"></span></div><div class="processing"><div><b>本节词典资料</b><p id="processSummary"></p></div><button id="processBtn" class="primary">处理未完成内容</button><button id="pauseBtn" hidden>暂停</button></div><div id="progress" hidden><progress id="progressBar" max="1" value="0"></progress><span id="progressText"></span></div><div id="pageWords" class="word-chips"></div><div class="notes"><label for="pageNotes">我的课堂笔记 <small id="noteState"></small></label><textarea id="pageNotes" rows="3" placeholder="记录老师的补充说明、例句或自己的疑问…"></textarea></div></section></main>
<aside id="detail"><span class="eyebrow">词语学习卡</span><h2>点击课件中的法语</h2><p>第一次整理后，词义和发音会保存在本地。再次打开，无须重新分析。</p><div class="tip">音标、英语、中文和字母组合有独立分类，不会被误送去查词。</div></aside></div>
<audio id="player" preload="none"></audio><dialog id="dialog"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭窗口">×</button></div><div id="dialogBody"></div></dialog><script src="/app.js"></script></body></html>
