name: Test and release Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install -e . --no-deps
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows packages
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Shiyu-windows-x64
          path: release/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Shiyu-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; retaining its verified assets."
          else
            gh release create "$RELEASE_TAG" release/* --draft --title "拾语 $RELEASE_TAG" --notes "Windows x64 公开测试版。安装版无需 Python；课程资料独立保存。文件未代码签名，请核对 SHA256SUMS.txt。"
          fi
